<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f5f2">
  <title>MobCheck — заметки по мобильной версии</title>
  <style>
    :root{--bg:#f6f5f2;--card:#fff;--text:#1d1d1b;--muted:#77736d;--line:#dedbd4;--accent:#1d1d1b;--soft:#ece9e2;--danger:#a33;--radius:22px;--shadow:0 12px 40px rgba(25,24,20,.07)}
    *{box-sizing:border-box}html{font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}body{margin:0;min-height:100vh}
    button,textarea,input{font:inherit}button{cursor:pointer}.shell{width:min(920px,100%);margin:auto;padding:clamp(18px,4vw,44px) clamp(14px,4vw,28px) 80px}
    header{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-bottom:28px}.eyebrow{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;margin:0 0 8px}h1{font-size:clamp(28px,5vw,48px);line-height:1.02;letter-spacing:-.045em;margin:0 0 12px}.intro{margin:0;color:var(--muted);line-height:1.5;max-width:610px}
    .toolbar{position:sticky;top:0;z-index:5;background:rgba(246,245,242,.91);backdrop-filter:blur(16px);padding:12px 0;margin:0 0 16px;display:flex;gap:10px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:12px 17px;font-weight:700;min-height:46px}.btn.primary{background:var(--accent);color:#fff;border-color:var(--accent)}.btn:hover{transform:translateY(-1px)}
    #notes{display:grid;gap:16px}.empty{border:1px dashed #c9c5bd;border-radius:var(--radius);padding:48px 24px;text-align:center;color:var(--muted);background:rgba(255,255,255,.45)}
    .note{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}.note-head{display:flex;align-items:center;justify-content:space-between;padding:17px 18px;border-bottom:1px solid var(--line)}.note-title{font-weight:800;font-size:17px}.actions{display:flex;gap:8px}.icon-btn{border:0;background:var(--soft);border-radius:999px;padding:9px 12px;color:var(--text);font-size:13px}.icon-btn.danger{color:var(--danger)}
    .note-body{display:grid;grid-template-columns:minmax(250px,.88fr) minmax(280px,1.12fr);gap:0}.image-side{padding:18px;border-right:1px solid var(--line)}.drop{min-height:270px;border:1.5px dashed #bbb7af;border-radius:16px;background:#faf9f6;display:flex;align-items:center;justify-content:center;text-align:center;overflow:hidden;position:relative}.drop.drag{border-color:#333;background:#f0eee9}.drop input{position:absolute;inset:0;opacity:0;cursor:pointer}.drop img{display:block;width:100%;height:auto;max-height:620px;object-fit:contain;background:#eee}.upload-copy{padding:24px;color:var(--muted);line-height:1.45}.upload-copy b{display:block;color:var(--text);margin-bottom:5px}.replace{margin-top:10px;width:100%}
    .text-side{padding:18px;display:flex;flex-direction:column}.label{font-size:13px;font-weight:800;margin:0 0 9px}.comment{width:100%;min-height:270px;flex:1;resize:vertical;border:1px solid var(--line);border-radius:16px;background:#fbfaf8;color:var(--text);padding:15px;line-height:1.5;outline:none}.comment:focus{border-color:#777;box-shadow:0 0 0 3px rgba(40,40,35,.08)}.saved{font-size:12px;color:var(--muted);margin:9px 2px 0;min-height:18px}
    .footer-note{font-size:12px;color:var(--muted);text-align:center;margin-top:24px;line-height:1.45}
    @media(max-width:680px){.shell{padding-top:24px}header{display:block}.toolbar{top:0}.toolbar .btn{flex:1}.note-body{grid-template-columns:1fr}.image-side{border-right:0;border-bottom:1px solid var(--line);padding:14px}.text-side{padding:14px}.drop,.comment{min-height:220px}.note-head{padding:14px}.icon-btn{padding:8px 10px}.intro{font-size:14px}}
  </style>
</head>
<body>
  <main class="shell">
    <header><div><p class="eyebrow">Проверка мобильной версии</p><h1>MobCheck</h1><p class="intro">Добавляйте скриншот и комментарий к каждой заметке. Новые заметки появляются по порядку и сохраняются на этом устройстве.</p></div></header>
    <div class="toolbar"><button class="btn primary" id="add">＋ Добавить заметку</button><button class="btn" id="export">Скачать резервную копию</button><button class="btn" id="importBtn">Загрузить копию</button><input id="importFile" type="file" accept="application/json" hidden></div>
    <section id="notes" aria-live="polite"></section>
    <p class="footer-note">Данные хранятся только в браузере. Для переноса на другое устройство скачайте резервную копию и загрузите её там.</p>
  </main>
  <template id="noteTemplate">
    <article class="note"><div class="note-head"><span class="note-title"></span><div class="actions"><button class="icon-btn danger delete" type="button">Удалить</button></div></div><div class="note-body"><div class="image-side"><div class="drop"><input class="file" type="file" accept="image/*"><div class="upload-copy"><b>Добавить скриншот</b><span>Нажмите сюда или перетащите изображение</span></div></div><button class="btn replace" type="button" hidden>Заменить изображение</button></div><div class="text-side"><label class="label">Комментарий</label><textarea class="comment" placeholder="Опишите, что нужно исправить или проверить…"></textarea><div class="saved"></div></div></div></article>
  </template>
  <script>
  (()=>{
    const DB='mobcheck-db', STORE='notes'; let db, notes=[];
    const el=document.querySelector('#notes'), tpl=document.querySelector('#noteTemplate');
    const open=indexedDB.open(DB,1); open.onupgradeneeded=()=>open.result.createObjectStore(STORE,{keyPath:'id'}); open.onsuccess=async()=>{db=open.result;notes=await all();render()}; open.onerror=()=>alert('Не удалось открыть хранилище браузера.');
    const tx=(mode='readonly')=>db.transaction(STORE,mode).objectStore(STORE);
    const all=()=>new Promise((ok,no)=>{const r=tx().getAll();r.onsuccess=()=>ok(r.result.sort((a,b)=>a.created-b.created));r.onerror=()=>no(r.error)});
    const save=n=>new Promise((ok,no)=>{const r=tx('readwrite').put(n);r.onsuccess=ok;r.onerror=()=>no(r.error)});
    const remove=id=>new Promise((ok,no)=>{const r=tx('readwrite').delete(id);r.onsuccess=ok;r.onerror=()=>no(r.error)});
    const toData=file=>new Promise((ok,no)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=no;r.readAsDataURL(file)});
    function render(){el.innerHTML='';if(!notes.length){el.innerHTML='<div class="empty">Заметок пока нет.<br>Нажмите «Добавить заметку», чтобы начать.</div>';return}notes.forEach((n,i)=>el.append(card(n,i)))}
    function card(n,i){const x=tpl.content.firstElementChild.cloneNode(true);x.querySelector('.note-title').textContent=`Заметка ${i+1}`;const drop=x.querySelector('.drop'),file=x.querySelector('.file'),rep=x.querySelector('.replace'),comment=x.querySelector('.comment'),status=x.querySelector('.saved');
      if(n.image){drop.innerHTML=`<img alt="Скриншот заметки ${i+1}">`;drop.querySelector('img').src=n.image;rep.hidden=false}
      const choose=()=>{if(n.image){const inp=document.createElement('input');inp.type='file';inp.accept='image/*';inp.onchange=()=>setImage(inp.files[0]);inp.click()}else file.click()};
      const setImage=async f=>{if(!f)return;if(!f.type.startsWith('image/'))return alert('Выберите изображение.');n.image=await toData(f);await save(n);render()};
      file?.addEventListener('change',()=>setImage(file.files[0]));rep.onclick=choose;drop.ondragover=e=>{e.preventDefault();drop.classList.add('drag')};drop.ondragleave=()=>drop.classList.remove('drag');drop.ondrop=e=>{e.preventDefault();drop.classList.remove('drag');setImage(e.dataTransfer.files[0])};
      comment.value=n.comment||'';let timer;comment.oninput=()=>{n.comment=comment.value;status.textContent='Сохраняю…';clearTimeout(timer);timer=setTimeout(async()=>{await save(n);status.textContent='Сохранено'},350)};
      x.querySelector('.delete').onclick=async()=>{if(confirm(`Удалить заметку ${i+1}?`)){await remove(n.id);notes=notes.filter(v=>v.id!==n.id);render()}};return x}
    document.querySelector('#add').onclick=async()=>{const n={id:crypto.randomUUID(),created:Date.now(),image:'',comment:''};await save(n);notes.push(n);render();requestAnimationFrame(()=>el.lastElementChild?.scrollIntoView({behavior:'smooth',block:'start'}))};
    document.querySelector('#export').onclick=()=>{const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),notes},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`mobcheck-${new Date().toISOString().slice(0,10)}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
    document.querySelector('#importBtn').onclick=()=>document.querySelector('#importFile').click();document.querySelector('#importFile').onchange=async e=>{try{const data=JSON.parse(await e.target.files[0].text());if(!Array.isArray(data.notes))throw 0;if(notes.length&&!confirm('Заменить текущие заметки данными из резервной копии?'))return;const s=tx('readwrite');s.clear();for(const n of data.notes)s.put(n);await new Promise((ok,no)=>{s.transaction.oncomplete=ok;s.transaction.onerror=no});notes=await all();render()}catch{alert('Не удалось загрузить резервную копию.')}};
  })();
  </script>
</body>
</html>
